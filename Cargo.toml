[package]
name = "atlas-terminal"
version = "0.2.47"
edition = "2024"
publish = false
description = "Atlas Terminal — native GPU shell (GPUI + alacritty_terminal)"
license = "MIT"

[[bin]]
name = "atlas-terminal"
path = "src/main.rs"

[[bin]]
name = "atlas"
path = "src/bin/atlas.rs"

[dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.26"
portable-pty = "0.8.1"
smol = "2"
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
zstd = "0.13"
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.18.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
debug = false
strip = true
