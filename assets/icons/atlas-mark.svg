<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" color="#FF9E40">
  <!-- Solid Dark Background Plate with Smooth Rounded Corners -->
  <rect width="24" height="24" rx="5.5" fill="#0A0A0C"/>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5" stroke="#252528" stroke-width="0.6"/>

  <!-- Compass Outer Tick Ring -->
  <circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="0.7" stroke-dasharray="0.4 1.4" stroke-linecap="round" opacity="0.75"/>
  <circle cx="12" cy="12" r="6.6" stroke="currentColor" stroke-width="0.85" opacity="0.9"/>

  <!-- Cardinal Compass Pointers (North, South, East, West) with Rounded Vertices -->
  <path d="M12 2.4L13.2 6.6L12 5.7L10.8 6.6Z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M12 21.6L10.8 17.4L12 18.3L13.2 17.4Z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M21.6 12L17.4 13.3L18.3 12L17.4 10.8Z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M2.4 12L6.6 10.8L5.7 12L6.6 13.2Z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 45-degree Accent Dots -->
  <circle cx="18.1" cy="5.9" r="0.65" fill="currentColor" opacity="0.85"/>
  <circle cx="18.1" cy="18.1" r="0.65" fill="currentColor" opacity="0.85"/>
  <circle cx="5.9" cy="18.1" r="0.65" fill="currentColor" opacity="0.85"/>
  <circle cx="5.9" cy="5.9" r="0.65" fill="currentColor" opacity="0.85"/>

  <!-- Terminal Command Prompt (> _) with Smooth Rounded Caps -->
  <path d="M9.8 9.5L12.3 12L9.8 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.2 14.5H15.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg>
