<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Solid Dark Background Plate with Smooth Apple/Win11 Squircle Curvature -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Dark Rounded Plate (radius 112px on 512px canvas = 22%) -->
  <rect width="512" height="512" rx="112" fill="#0A0A0C"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#26262B" stroke-width="2.5"/>

  <!-- Compass Outer Tick Ring -->
  <circle cx="256" cy="256" r="184" stroke="#FF9E40" stroke-width="15" stroke-dasharray="8 28" stroke-linecap="round" opacity="0.75" filter="url(#amberGlow)"/>
  <circle cx="256" cy="256" r="140" stroke="#FFB066" stroke-width="18" opacity="0.9" filter="url(#amberGlow)"/>

  <!-- Cardinal Compass Pointers (North, South, East, West) with Smooth Rounded Vertices -->
  <path d="M256 50L282 140L256 122L230 140Z" fill="#FFB066" stroke="#FFB066" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#amberGlow)"/>
  <path d="M256 462L230 372L256 390L282 372Z" fill="#FFB066" stroke="#FFB066" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#amberGlow)"/>
  <path d="M462 256L372 282L390 256L372 230Z" fill="#FFB066" stroke="#FFB066" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#amberGlow)"/>
  <path d="M50 256L140 230L122 256L140 282Z" fill="#FFB066" stroke="#FFB066" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#amberGlow)"/>

  <!-- 45-degree Accent Studs -->
  <circle cx="386" cy="126" r="14" fill="#FFA54F" opacity="0.85" filter="url(#amberGlow)"/>
  <circle cx="386" cy="386" r="14" fill="#FFA54F" opacity="0.85" filter="url(#amberGlow)"/>
  <circle cx="126" cy="386" r="14" fill="#FFA54F" opacity="0.85" filter="url(#amberGlow)"/>
  <circle cx="126" cy="126" r="14" fill="#FFA54F" opacity="0.85" filter="url(#amberGlow)"/>

  <!-- Terminal Command Prompt (> _) with Rounded End Caps -->
  <path d="M208 202L262 256L208 310" stroke="#FFE0B2" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)"/>
  <path d="M282 310H324" stroke="#FFE0B2" stroke-width="30" stroke-linecap="round" filter="url(#amberGlow)"/>
</svg>
