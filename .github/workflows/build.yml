name: Build Atlas Terminal

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --ignore-version-mismatches

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: AtlasTerminal-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: error

      - name: Smoke test (app launches and stays alive)
        # Proves the exe from the previous step actually opens: with
        # windows_subsystem="windows" a startup panic exits silently,
        # so an immediately-dead process means "can't open the app".
        # Stdout/stderr are redirected to files so a Rust panic message
        # (exit 101) lands in the log instead of vanishing.
        run: |
          $exe = "src-tauri/target/release/atlas-terminal.exe"
          if (-not (Test-Path $exe)) { Write-Error "Missing $exe"; exit 1 }
          $env:RUST_BACKTRACE = "1"
          $p = Start-Process -FilePath $exe -RedirectStandardOutput "smoke-out.txt" -RedirectStandardError "smoke-err.txt" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Output "--- smoke-out.txt ---"
            Get-Content "smoke-out.txt" -ErrorAction SilentlyContinue
            Write-Output "--- smoke-err.txt ---"
            Get-Content "smoke-err.txt" -ErrorAction SilentlyContinue
            Write-Error "App exited at startup with code $($p.ExitCode)"; exit 1
          }
          Write-Output "App running (PID $($p.Id)), stopping smoke instance"
          Stop-Process -Id $p.Id -Force
