name: CI & Release Pipeline

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/smart-updater
    paths-ignore:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        shell: pwsh
        working-directory: .
        run: |
          cargo generate-lockfile

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: true

      - name: Locate fxc.exe (DirectX shader compiler for gpui release)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($fxc) {
            "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -Append $env:GITHUB_ENV
            Write-Output "GPUI_FXC_PATH=$($fxc.FullName)"
          } else {
            Write-Output "fxc.exe not found under Windows Kits; relying on PATH/gpui default"
          }

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            $candidatePaths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $found = $null
            foreach ($cand in $candidatePaths) {
              if (Test-Path $cand) {
                $found = Split-Path $cand
                break
              }
            }
            if ($found) {
              Write-Output "Found Inno Setup at $found; adding to PATH"
              $found | Out-File -Append $env:GITHUB_PATH
            } else {
              Write-Output "Inno Setup not found; installing via Chocolatey..."
              choco install innosetup --no-progress
              "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append $env:GITHUB_PATH
            }
          }

      - name: Install pinned zstd CLI (binary delta patches)
        shell: pwsh
        # CI generates exe patches with the zstd CLI (v1.5.7, pinned + hash
        # verified). The app decodes them with the Rust zstd crate, so both
        # sides must agree on the --patch-from format.
        run: |
          $zstdVersion = "1.5.7"
          $expectedSha256 = "acb4e8111511749dc7a3ebedca9b04190e37a17afeb73f55d4425dbf0b90fad9"
          $zstdZip = Join-Path $env:RUNNER_TEMP "zstd-v$zstdVersion-win64.zip"
          $zstdDir = Join-Path $env:RUNNER_TEMP "zstd-v$zstdVersion-win64"
          $zstdUrl = "https://github.com/facebook/zstd/releases/download/v$zstdVersion/zstd-v$zstdVersion-win64.zip"

          Remove-Item -Force $zstdZip -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $zstdDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $zstdDir | Out-Null

          Write-Output "Downloading $zstdUrl"
          Invoke-WebRequest -Uri $zstdUrl -OutFile $zstdZip -UseBasicParsing

          $actualSha256 = (Get-FileHash -Path $zstdZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "zstd zip hash mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -Path $zstdZip -DestinationPath $zstdDir -Force
          $zstdExe = Get-ChildItem -Path $zstdDir -Filter "zstd.exe" -Recurse -File | Select-Object -First 1
          if (-not $zstdExe) {
            throw "zstd.exe not found after extracting $zstdZip to $zstdDir"
          }

          "ZSTD_EXE=$($zstdExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "ZSTD_EXE=$($zstdExe.FullName)"
          & $zstdExe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "zstd.exe --version failed (exit $LASTEXITCODE)" }

      - name: cargo test (unit tests)
        shell: pwsh
        run: |
          cargo test --release --bin atlas-terminal -- --nocapture 2>&1 | Tee-Object -FilePath test-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## cargo test failed (exit $code)" >> $env:GITHUB_STEP_SUMMARY
            $tail = Get-Content test-output.log -Tail 60
            $msg = ($tail -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=test-failure::$msg"
            exit $code
          }

      - name: cargo build (release — final exe)
        shell: pwsh
        run: |
          cargo build --release --bin atlas-terminal 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## cargo build failed (exit $code)" >> $env:GITHUB_STEP_SUMMARY
            # Mirror rustc errors as workflow annotations so they are readable
            # without authentication (logs + artifacts need a login).
            $n = 0
            $pending = ""
            foreach ($line in Get-Content build-output.log) {
              if ($line -match '^(?<sev>error|warning)(?<rest>.*)$') {
                $pending = "$($matches['sev'])$($matches['rest'])"
              } elseif ($pending -ne "" -and $line -match '^\s*-->\s*(?<loc>\S+)\s*$') {
                if ($n -lt 60) {
                  $n++
                  $msg = ("$pending @ $($matches['loc'])") -replace '%','%25'
                  Write-Output "::error::$msg"
                }
                $pending = ""
              } elseif ($line -match '^\s*$') {
                if ($pending -ne "" -and $n -lt 60) {
                  $n++
                  $msg = ($pending -replace '%','%25')
                  Write-Output "::error::$msg"
                }
                $pending = ""
              }
            }
            if ($pending -ne "" -and $n -lt 60) {
              Write-Output ("::error::" + ($pending -replace '%','%25'))
            }
            Get-Content build-output.log -Tail 150 | Out-String >> $env:GITHUB_STEP_SUMMARY
            exit $code
          }
          "## atlas-terminal compiled (release)" >> $env:GITHUB_STEP_SUMMARY

          # Locate built binary in workspace target
          $builtTerm = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          if (-not (Test-Path $builtTerm)) {
            throw "Built binary not found at $builtTerm"
          }

          # Mirror to both filenames for compatibility
          $destPaths = @(
            (Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"),
            (Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-native.exe")
          )
          foreach ($dst in $destPaths) {
            $dir = Split-Path $dst
            if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force $dir | Out-Null }
            if ($dst -ne $builtTerm) {
              Copy-Item $builtTerm $dst -Force
            }
          }
          Write-Output "Mirrored single release binary to all target destinations"

      - name: Smoke test (launch release exe, wait for window)
        shell: pwsh
        # Informational: the runner has no real GPU. Never blocks the artifact.
        # Tells us whether the exe got past GPUI platform init ("window opened")
        # or died (PANIC in the log). Results are mirrored as public annotations.
        continue-on-error: true
        run: |
          $candidate1 = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          $candidate2 = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-native.exe"
          $exe = if (Test-Path $candidate1) { $candidate1 } else { $candidate2 }
          $log = Join-Path $env:TEMP "atlas-native-debug.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $log) {
              $content = Get-Content $log -Raw
              if ($content -match "window opened") { $ok = $true; break }
              if ($content -match "PANIC") { break }
            }
            if ($proc.HasExited -and -not (Test-Path $log)) { break }
          }
          # Give the DWM corner-rounding helper a beat to report.
          for ($i = 0; $i -lt 15; $i++) {
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match "dwm")) { break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Write-Output "----- atlas-native-debug.log -----"
          if (Test-Path $log) { Get-Content $log } else { Write-Output "(no log written)" }
          if ($ok) {
            "## smoke test: window opened" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "::notice title=smoke test::release exe reached 'window opened'"
            $dwm = if (Test-Path $log) { Get-Content $log | Where-Object { $_ -match "dwm" } | Select-Object -First 1 }
            if ($dwm) { Write-Output ("::notice title=dwm corners::" + ($dwm -replace '%','%25')) }
            $font = if (Test-Path $log) { Get-Content $log | Where-Object { $_ -match "font" } | Select-Object -First 1 }
            if ($font) { Write-Output ("::notice title=nerd font::" + ($font -replace '%','%25')) }
          } else {
            "## smoke test: did NOT observe 'window opened'" >> $env:GITHUB_STEP_SUMMARY
            $n = 0
            if (Test-Path $log) {
              foreach ($line in Get-Content $log) {
                if ($n -ge 12) { break }
                if ($line.Trim()) { $n++; Write-Output ("::warning title=smoke test::" + ($line -replace '%','%25')) }
              }
            } else {
              Write-Output "::warning title=smoke test::no log written (exe may have died before main)"
            }
          }

      - name: Build Inno Setup Installer & Zip Distribution
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Determine base version from Cargo.toml
          $cargoFile = Join-Path $env:GITHUB_WORKSPACE "Cargo.toml"
          $version = "0.1.4"
          if (Test-Path $cargoFile) {
            $match = Select-String -Path $cargoFile -Pattern '^version\s*=\s*"([^"]+)"'
            if ($match) {
              $version = $match.Matches[0].Groups[1].Value
            }
          }

          $cargoVersion = $version
          if ($env:GITHUB_REF -match '^refs/tags/v?(\d+\.\d+\.\d+)$') {
            $tagVersion = $matches[1]
            if ($tagVersion -ne $cargoVersion) {
              throw "Cargo.toml version $cargoVersion does not match release tag $($env:GITHUB_REF_NAME)"
            }
            $version = $tagVersion
          }
          Write-Output "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Output "Packaging Atlas Terminal v$version"

          # 2. Run Inno Setup compiler
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $issPath = Join-Path $env:GITHUB_WORKSPACE "installer\atlas-terminal.iss"
          iscc.exe "/DMyAppVersion=$version" "/O$distDir" $issPath
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          # 3. Generate SHA256 checksum for installer
          $setupExe = Join-Path $distDir "AtlasTerminal-Setup-$version.exe"
          if (Test-Path $setupExe) {
            $shaFile = "$setupExe.sha256"
            $hash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([System.IO.Path]::GetFileName($setupExe))" | Out-File -Encoding ascii $shaFile
            Write-Output "Installer created: $setupExe ($hash)"
          } else {
            throw "Expected setup exe not found at $setupExe"
          }

          # 4. Create plain zip distribution (atlas-terminal-windows-x64.zip)
          $zipStaging = Join-Path $env:RUNNER_TEMP "atlas-terminal-zip-staging"
          Remove-Item -Recurse -Force $zipStaging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $zipStaging | Out-Null

          $termExe = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          Copy-Item $termExe (Join-Path $zipStaging "atlas-terminal.exe")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE") (Join-Path $zipStaging "LICENSE")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "README.md") (Join-Path $zipStaging "README.md")
          Copy-Item -Recurse (Join-Path $env:GITHUB_WORKSPACE "assets") (Join-Path $zipStaging "assets")

          $sourceFileCount = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "assets") -Recurse -File).Count + 3
          $stagedFileCount = @(Get-ChildItem -LiteralPath $zipStaging -Recurse -File).Count
          if ($stagedFileCount -ne $sourceFileCount) {
            throw "Zip staging incomplete: $stagedFileCount files staged, expected $sourceFileCount"
          }

          $zipFile = Join-Path $distDir "atlas-terminal-windows-x64.zip"
          Remove-Item $zipFile -ErrorAction SilentlyContinue
          Compress-Archive -Path "$zipStaging\*" -DestinationPath $zipFile -Force

          $zipSha = "$zipFile.sha256"
          $hashZip = (Get-FileHash -Path $zipFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hashZip *$([System.IO.Path]::GetFileName($zipFile))" | Out-File -Encoding ascii $zipSha
          Write-Output "Zip created: $zipFile ($hashZip)"

          # 5. Incremental updater assets: zstd binary deltas + atlas-update.json
          # The app resolves assets under the future release tag URL, so patch
          # URLs are built up-front (repo hardcoded to match the app).
          $repoSlug = "akrram0/atlas-terminal"
          $releaseBaseUrl = "https://github.com/$repoSlug/releases/download/v$version"

          $newExe = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          if (-not (Test-Path $newExe)) { throw "Current release exe not found at $newExe" }
          $newExeHash = (Get-FileHash -Path $newExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $newExeSize = (Get-Item $newExe).Length
          $setupHash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setupExe).Length

          # Fingerprint of every non-exe file (relative path + sha256, sorted).
          # A patch only ships if the old and new zip carry identical
          # assets/docs; otherwise an exe-only patch would leave stale files.
          # Text line endings are normalized: Git checkout on Windows has
          # historically produced CRLF for one release and LF for another, but
          # the bundled docs/SVGs are identical to the app.
          function Get-NonExeFingerprint {
            param([Parameter(Mandatory = $true)][string]$Root)
            # Use DirectoryInfo/FileInfo for both the root and children. Mixing
            # Resolve-Path with Get-ChildItem can produce different path forms
            # (short 8.3 vs long) and corrupt the relative-path subtraction.
            $rootDir = New-Object System.IO.DirectoryInfo -ArgumentList $Root
            $rootFull = $rootDir.FullName.TrimEnd([System.IO.Path]::DirectorySeparatorChar)
            $lines = @()
            $textExtensions = @('.md', '.txt', '.svg', '.rc', '.ps1', '.json')
            foreach ($file in $rootDir.GetFiles('*', [System.IO.SearchOption]::AllDirectories)) {
              if ($file.Name -eq 'atlas-terminal.exe') { continue }
              $relPath = $file.FullName.Substring($rootFull.Length).TrimStart('\').Replace('\', '/')
              $ext = $file.Extension.ToLowerInvariant()
              if ($textExtensions -contains $ext -or $file.Name -eq 'LICENSE') {
                $normalized = ([System.IO.File]::ReadAllText($file.FullName)) -replace "`r`n", "`n"
                $sha = [System.Security.Cryptography.SHA256]::Create()
                $fileHash = ([BitConverter]::ToString(
                  $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($normalized))
                ) -replace '-', '').ToLowerInvariant()
                $sha.Dispose()
              } else {
                $fileHash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              $lines += "$relPath=$fileHash"
            }
            $sorted = @($lines | Sort-Object)
            return ($sorted -join "`n")
          }

          $newFingerprint = Get-NonExeFingerprint -Root $zipStaging
          $newFpLines = @($newFingerprint -split "`n" | Where-Object { $_ }).Count

          # Decoder self-test: always exercise the app's zstd dictionary decoder,
          # even when no previous release is a valid patch base (e.g. the first
          # release with this updater). The base is a copy of the new exe with
          # one byte changed, so the frame references a full-size dictionary.
          $selfBase = Join-Path $env:RUNNER_TEMP "atlas-self-base.exe"
          $selfPatch = Join-Path $env:RUNNER_TEMP "atlas-self.zstpatch"
          $selfOut = Join-Path $env:RUNNER_TEMP "atlas-self-out.exe"
          Remove-Item $selfBase, $selfPatch, $selfOut -Force -ErrorAction SilentlyContinue
          Copy-Item $newExe $selfBase
          $selfBytes = [System.IO.File]::ReadAllBytes($selfBase)
          $selfIndex = [int]($selfBytes.Length / 2)
          $selfBytes[$selfIndex] = [byte]($selfBytes[$selfIndex] -bxor 0xFF)
          [System.IO.File]::WriteAllBytes($selfBase, $selfBytes)
          & $env:ZSTD_EXE "--patch-from=$selfBase" --ultra -22 -f "$newExe" -o "$selfPatch"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $selfPatch)) {
            throw "Decoder self-test: zstd failed to create a patch (exit $LASTEXITCODE)"
          }
          $selfArgLine = '--apply-delta "{0}" "{1}" "{2}" "{3}"' -f $selfBase, $selfPatch, $selfOut, $newExeHash
          $selfProc = Start-Process -FilePath $newExe -ArgumentList $selfArgLine -PassThru
          if (-not $selfProc.WaitForExit(180000)) {
            Stop-Process -Id $selfProc.Id -Force -ErrorAction SilentlyContinue
            throw "Decoder self-test: app timed out"
          }
          if ($selfProc.ExitCode -ne 0) {
            throw "Decoder self-test: app decoder failed (exit $($selfProc.ExitCode))"
          }
          if (-not (Test-Path $selfOut)) {
            throw "Decoder self-test: app produced no output"
          }
          $selfHash = (Get-FileHash -Path $selfOut -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($selfHash -ne $newExeHash) {
            throw "Decoder self-test: output mismatch (got $selfHash, expected $newExeHash)"
          }
          Remove-Item $selfBase, $selfPatch, $selfOut -Force -ErrorAction SilentlyContinue
          Write-Output "Decoder self-test passed"

          # Up to 3 most recent published (non-draft) releases, excluding ours.
          $previousTags = @()
          $script:skipReasons = @()
          try {
            $releasesJson = gh release list --limit 12 --json tagName,isDraft,isPrerelease
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "gh release list failed (exit $LASTEXITCODE); publishing with empty deltas"
            } elseif ($releasesJson) {
              $releases = $releasesJson | ConvertFrom-Json
              if ($releases) {
                $previousTags = @($releases |
                  Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne "v$version" } |
                  Select-Object -First 3 |
                  ForEach-Object { $_.tagName })
              }
            }
          } catch {
            Write-Warning "Could not enumerate previous releases: $($_.Exception.Message)"
            $previousTags = @()
          }

          # Resolve + validate a previous release as a patch base. Returns $null
          # (never throws) so an unavailable/malformed old release is skippable.
          function Resolve-PreviousBase {
            param(
              [Parameter(Mandatory = $true)][string]$Tag,
              [Parameter(Mandatory = $true)][string]$WorkDir,
              [Parameter(Mandatory = $true)][string]$ExpectedFingerprint
            )
            try {
              Remove-Item -Recurse -Force $WorkDir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $WorkDir | Out-Null

              gh release download $Tag --pattern "atlas-terminal-windows-x64.zip" --dir $WorkDir --clobber
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Skipping delta from ${Tag}: zip download failed (exit $LASTEXITCODE)"
                $script:skipReasons += "${Tag}: zip download failed"
                return $null
              }
              $prevZip = Join-Path $WorkDir "atlas-terminal-windows-x64.zip"
              if (-not (Test-Path $prevZip)) {
                Write-Warning "Skipping delta from ${Tag}: zip missing after download"
                $script:skipReasons += "${Tag}: zip missing after download"
                return $null
              }

              $extractDir = Join-Path $WorkDir "extract"
              Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
              Expand-Archive -Path $prevZip -DestinationPath $extractDir -Force

              $oldExe = Join-Path $extractDir "atlas-terminal.exe"
              $oldRoot = $extractDir
              if (-not (Test-Path $oldExe)) {
                # Tolerate a nested layout as long as the exe is findable.
                $foundExe = Get-ChildItem -Path $extractDir -Filter "atlas-terminal.exe" -Recurse -File |
                  Select-Object -First 1
                if (-not $foundExe) {
                  Write-Warning "Skipping delta from ${Tag}: atlas-terminal.exe not found in zip"
                  $script:skipReasons += "${Tag}: atlas-terminal.exe not found in zip"
                  return $null
                }
                $oldExe = $foundExe.FullName
                $oldRoot = Split-Path $oldExe
              }

              $oldFingerprint = Get-NonExeFingerprint -Root $oldRoot
              if ($oldFingerprint -ne $ExpectedFingerprint) {
                $newLines = @($ExpectedFingerprint -split "`n" | Where-Object { $_ })
                $oldLines = @($oldFingerprint -split "`n" | Where-Object { $_ })
                $fpDiff = Compare-Object -ReferenceObject $newLines -DifferenceObject $oldLines -CaseSensitive
                $newOnly = @($fpDiff | Where-Object { $_.SideIndicator -eq '<=' })
                $oldOnly = @($fpDiff | Where-Object { $_.SideIndicator -eq '=>' })
                $formatDiff = {
                  param($items)
                  @($items | Select-Object -First 4 | ForEach-Object {
                    $line = [string]$_.InputObject
                    if ($line.Length -gt 130) { $line = $line.Substring(0, 130) + '...' }
                    "$($_.SideIndicator) $line"
                  }) -join ' | '
                }
                $fpText = if ($newOnly -or $oldOnly) {
                  "new=[$(& $formatDiff $newOnly)] old=[$(& $formatDiff $oldOnly)]"
                } else {
                  "lengths new=$($ExpectedFingerprint.Length) old=$($oldFingerprint.Length)"
                }
                Write-Warning "Skipping delta from ${Tag}: bundled non-exe assets differ ($fpText)"
                $script:skipReasons += "${Tag}: assets differ [$fpText]"
                return $null
              }

              return [pscustomobject]@{ Exe = $oldExe; Root = $oldRoot }
            } catch {
              Write-Warning "Skipping delta from ${Tag}: $($_.Exception.Message)"
              $script:skipReasons += "${Tag}: $($_.Exception.Message)"
              return $null
            }
          }

          $deltas = @()
          foreach ($prevTag in $previousTags) {
            $fromVersion = $prevTag -replace '^v', ''
            if ([string]::IsNullOrWhiteSpace($fromVersion) -or $fromVersion -eq $version) { continue }

            $workDir = Join-Path $env:RUNNER_TEMP "atlas-delta-$fromVersion"
            $base = Resolve-PreviousBase -Tag $prevTag -WorkDir $workDir -ExpectedFingerprint $newFingerprint
            if (-not $base) {
              Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
              continue
            }
            $oldExe = $base.Exe

            # From here on every failure is fatal: a bad patch must never ship.
            try {
              if (-not $env:ZSTD_EXE -or -not (Test-Path $env:ZSTD_EXE)) {
                throw "ZSTD_EXE is not set or does not point at an existing file"
              }

              $patchName = "atlas-exe-$fromVersion-to-$version.zstpatch"
              $patchPath = Join-Path $distDir $patchName
              Remove-Item $patchPath -ErrorAction SilentlyContinue
              & $env:ZSTD_EXE "--patch-from=$oldExe" --ultra -22 -f "$newExe" -o "$patchPath"
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $patchPath)) {
                throw "zstd failed to create $patchName (exit $LASTEXITCODE)"
              }

              # Verify (a): the CLI can rebuild the new exe from old + patch.
              $verifyCli = Join-Path $workDir "verify-cli.exe"
              Remove-Item $verifyCli -ErrorAction SilentlyContinue
              & $env:ZSTD_EXE -d "--patch-from=$oldExe" -f "$patchPath" -o "$verifyCli"
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $verifyCli)) {
                throw "zstd could not apply $patchName (exit $LASTEXITCODE)"
              }
              $verifyCliHash = (Get-FileHash -Path $verifyCli -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($verifyCliHash -ne $newExeHash) {
                throw "CLI patch verification mismatch for $patchName (got $verifyCliHash, expected $newExeHash)"
              }

              # Verify (b): the freshly built app's own decoder reproduces the
              # exact new exe from the same patch (catches zstd crate/CLI drift).
              $verifyApp = Join-Path $workDir "verify-app.exe"
              Remove-Item $verifyApp -ErrorAction SilentlyContinue
              $argLine = '--apply-delta "{0}" "{1}" "{2}" "{3}"' -f $oldExe, $patchPath, $verifyApp, $newExeHash
              $deltaProc = Start-Process -FilePath $newExe -ArgumentList $argLine -PassThru
              if (-not $deltaProc.WaitForExit(180000)) {
                Stop-Process -Id $deltaProc.Id -Force -ErrorAction SilentlyContinue
                throw "App delta verification timed out for $patchName"
              }
              if ($deltaProc.ExitCode -ne 0) {
                throw "App delta verification failed for $patchName (exit $($deltaProc.ExitCode))"
              }
              if (-not (Test-Path $verifyApp)) {
                throw "App delta verification produced no output for $patchName"
              }
              $verifyAppHash = (Get-FileHash -Path $verifyApp -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($verifyAppHash -ne $newExeHash) {
                throw "App patch verification mismatch for $patchName (got $verifyAppHash, expected $newExeHash)"
              }

              $patchHash = (Get-FileHash -Path $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $patchSize = (Get-Item $patchPath).Length
              $oldExeHash = (Get-FileHash -Path $oldExe -Algorithm SHA256).Hash.ToLowerInvariant()

              $deltas += [ordered]@{
                from_version    = $fromVersion
                from_exe_sha256 = $oldExeHash
                patch           = [ordered]@{
                  name   = $patchName
                  url    = "$releaseBaseUrl/$patchName"
                  size   = $patchSize
                  sha256 = $patchHash
                }
                to_exe_sha256 = $newExeHash
                to_exe_size   = $newExeSize
              }
              Write-Output "Delta patch $patchName : $patchSize bytes, sha256 $patchHash"
            } finally {
              Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
            }
          }

          $manifest = [ordered]@{
            schema    = 1
            version   = $version
            tag       = "v$version"
            # ManifestFile requires url on every file object, including exe.
            # The bare exe ships inside the release zip, so point at that.
            exe       = [ordered]@{
              name   = "atlas-terminal.exe"
              url    = "$releaseBaseUrl/atlas-terminal-windows-x64.zip"
              size   = $newExeSize
              sha256 = $newExeHash
            }
            installer = [ordered]@{
              name   = "AtlasTerminal-Setup-$version.exe"
              url    = "$releaseBaseUrl/AtlasTerminal-Setup-$version.exe"
              size   = $setupSize
              sha256 = $setupHash
            }
            deltas    = @($deltas)
          }

          $manifestPath = Join-Path $distDir "atlas-update.json"
          $manifestJson = $manifest | ConvertTo-Json -Depth 8
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manifestPath, $manifestJson, $utf8NoBom)

          Write-Output "----- atlas-update.json -----"
          Write-Output (Get-Content $manifestPath -Raw)
          Write-Output "-----------------------------"
          $candidateBases = if ($previousTags.Count -gt 0) { $previousTags -join ', ' } else { '(none)' }
          $deltaText = if ($deltas.Count -gt 0) {
            ($deltas | ForEach-Object { "$($_.from_version):$($_.patch.size)" }) -join ', '
          } else {
            'none'
          }
          Write-Output "Deltas generated: $($deltas.Count) (candidate bases: $candidateBases)"
          Write-Output "::notice title=updater::Deltas=$($deltas.Count); sizes=$deltaText; bases=$candidateBases; new-fp-lines=$newFpLines; decoder-self-test=passed"
          if ($script:skipReasons.Count -gt 0) {
            $skipText = ($script:skipReasons -join '; ') -replace "`r?`n", ' '
            Write-Output "::notice title=updater-skipped::$skipText"
          }

          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if ($summaryPath) {
            $summary = @(
              "## Atlas updater packaging",
              "",
              "- Version: ``$version``",
              "- Previous release candidates: $candidateBases",
              "- Staged files: ``$stagedFileCount``",
              "- New fingerprint files: ``$newFpLines``",
              "- Deltas generated: ``$($deltas.Count)``",
              "- Decoder self-test: passed"
            )
            foreach ($delta in $deltas) {
              $summary += "- Delta from ``$($delta.from_version)``: ``$($delta.patch.name)`` ($($delta.patch.size) bytes)"
            }
            if ($script:skipReasons.Count -gt 0) {
              $summary += ""
              $summary += "Skipped bases:"
              foreach ($reason in $script:skipReasons) {
                $summary += "- $reason"
              }
            }
            $summary += ""
            $summary += "Manifest:"
            $summary += '```json'
            $summary += (Get-Content $manifestPath -Raw)
            $summary += '```'
            $summary -join "`n" | Out-File -FilePath $summaryPath -Append -Encoding utf8
          }

          # Zip staging is only needed for the asset fingerprint comparison above.
          Remove-Item -Recurse -Force $zipStaging -ErrorAction SilentlyContinue

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-terminal-build-log
          path: build-output.log
          if-no-files-found: ignore

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-terminal-binaries
          path: |
            target/release/atlas-terminal.exe
            target/release/atlas-native.exe
          if-no-files-found: error

      - name: Upload distribution packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-terminal-dist
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (main)
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$($env:APP_VERSION)"
          Write-Output "Publishing release $tag from $env:GITHUB_SHA"

          # The updater requires atlas-update.json; never publish without it.
          $manifest = Join-Path "$env:GITHUB_WORKSPACE\dist" "atlas-update.json"
          if (-not (Test-Path $manifest)) { throw "atlas-update.json missing from dist; refusing to publish" }

          # Reuse a complete release from an earlier main run for this version.
          $existingJson = gh release view $tag --json isDraft,assets 2>$null
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0 -and $existingJson) {
            $existing = $existingJson | ConvertFrom-Json
            $hasManifest = @($existing.assets | Where-Object { $_.name -eq 'atlas-update.json' }).Count -gt 0
            if ($hasManifest -and -not $existing.isDraft) {
              Write-Output "Release $tag is already published with a manifest; skipping."
              exit 0
            }
            if ($existing.isDraft) {
              Write-Output "Draft release $tag found; resuming its upload."
            } else {
              Write-Output "Published release $tag found without a manifest; repairing it."
            }
          } else {
            # Draft first: clients only see the release after every asset,
            # including the manifest, is in place.
            gh release create $tag --draft --target $env:GITHUB_SHA --title "Atlas Terminal $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag (exit $LASTEXITCODE)" }
          }

          # Upload every referenced asset first, the manifest last, so clients
          # never resolve a manifest pointing at not-yet-uploaded files.
          $files = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*" -File |
            Where-Object { $_.Name -ne 'atlas-update.json' } |
            ForEach-Object { $_.FullName }
          if ($files) {
            gh release upload $tag $files --clobber
            if ($LASTEXITCODE -ne 0) { throw "asset upload failed for $tag (exit $LASTEXITCODE)" }
          }
          gh release upload $tag $manifest --clobber
          if ($LASTEXITCODE -ne 0) { throw "manifest upload failed for $tag (exit $LASTEXITCODE)" }

          # Publish last. A canceled run leaves a draft, which the next main
          # run can safely repair instead of exposing a partial release.
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release publish failed for $tag (exit $LASTEXITCODE)" }
          Write-Output "Released $tag with atlas-update.json last"
