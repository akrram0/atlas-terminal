name: atlas-native (GPUI POC)

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "atlas-native/**"
      - ".github/workflows/native.yml"
      - "Cargo.toml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atlas-native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas-native

      - name: Locate fxc.exe (DirectX shader compiler for gpui release)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($fxc) {
            "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -Append $env:GITHUB_ENV
            Write-Output "GPUI_FXC_PATH=$($fxc.FullName)"
          } else {
            Write-Output "fxc.exe not found under Windows Kits; relying on PATH/gpui default"
          }

      - name: cargo build (release — final exe)
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## cargo build failed (exit $code)" >> $env:GITHUB_STEP_SUMMARY
            # Mirror rustc errors as workflow annotations so they are readable
            # without authentication (logs + artifacts need a login).
            $n = 0
            $pending = ""
            foreach ($line in Get-Content build-output.log) {
              if ($line -match '^(?<sev>error|warning)(?<rest>.*)$') {
                $pending = "$($matches['sev'])$($matches['rest'])"
              } elseif ($pending -ne "" -and $line -match '^\s*-->\s*(?<loc>\S+)\s*$') {
                if ($n -lt 60) {
                  $n++
                  $msg = ("$pending @ $($matches['loc'])") -replace '%','%25'
                  Write-Output "::error::$msg"
                }
                $pending = ""
              } elseif ($line -match '^\s*$') {
                if ($pending -ne "" -and $n -lt 60) {
                  $n++
                  $msg = ($pending -replace '%','%25')
                  Write-Output "::error::$msg"
                }
                $pending = ""
              }
            }
            if ($pending -ne "" -and $n -lt 60) {
              Write-Output ("::error::" + ($pending -replace '%','%25'))
            }
            Get-Content build-output.log -Tail 150 | Out-String >> $env:GITHUB_STEP_SUMMARY
            exit $code
          }
          "## atlas-native compiled (release)" >> $env:GITHUB_STEP_SUMMARY

      - name: Smoke test (launch release exe, wait for window)
        shell: pwsh
        # Informational: the runner has no real GPU. Never blocks the artifact.
        # Tells us whether the exe got past GPUI platform init ("window opened")
        # or died (PANIC in the log). Results are mirrored as public annotations.
        continue-on-error: true
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "atlas-native\target\release\atlas-native.exe"
          $log = Join-Path $env:TEMP "atlas-native-debug.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $log) {
              $content = Get-Content $log -Raw
              if ($content -match "window opened") { $ok = $true; break }
              if ($content -match "PANIC") { break }
            }
            if ($proc.HasExited -and -not (Test-Path $log)) { break }
          }
          # Give the DWM corner-rounding helper a beat to report.
          for ($i = 0; $i -lt 15; $i++) {
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match "dwm")) { break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Write-Output "----- atlas-native-debug.log -----"
          if (Test-Path $log) { Get-Content $log } else { Write-Output "(no log written)" }
          if ($ok) {
            "## smoke test: window opened" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "::notice title=smoke test::release exe reached 'window opened'"
            $dwm = if (Test-Path $log) { Get-Content $log | Where-Object { $_ -match "dwm" } | Select-Object -First 1 }
            if ($dwm) { Write-Output ("::notice title=dwm corners::" + ($dwm -replace '%','%25')) }
            $font = if (Test-Path $log) { Get-Content $log | Where-Object { $_ -match "font" } | Select-Object -First 1 }
            if ($font) { Write-Output ("::notice title=nerd font::" + ($font -replace '%','%25')) }
          } else {
            "## smoke test: did NOT observe 'window opened'" >> $env:GITHUB_STEP_SUMMARY
            $n = 0
            if (Test-Path $log) {
              foreach ($line in Get-Content $log) {
                if ($n -ge 12) { break }
                if ($line.Trim()) { $n++; Write-Output ("::warning title=smoke test::" + ($line -replace '%','%25')) }
              }
            } else {
              Write-Output "::warning title=smoke test::no log written (exe may have died before main)"
            }
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-native-build-log
          path: atlas-native/build-output.log
          if-no-files-found: ignore

      - name: Upload exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-native-poc
          path: atlas-native/target/release/atlas-native.exe
          if-no-files-found: error

      - name: Publish rolling release (direct exe download, no login)
        # Stable public URL:
        # https://github.com/akrram0/atlas-terminal/releases/download/native-latest/atlas-native.exe
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view native-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create native-latest --title "atlas-native (rolling POC build)" --notes "Rolling Windows build of the native POC (GPUI + alacritty_terminal). The exe is replaced on every push to main."
          }
          gh release upload native-latest "target\release\atlas-native.exe" --clobber
