name: CI & Release Pipeline

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        shell: pwsh
        working-directory: .
        run: |
          cargo generate-lockfile

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: true

      - name: Locate fxc.exe (DirectX shader compiler for gpui release)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($fxc) {
            "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -Append $env:GITHUB_ENV
            Write-Output "GPUI_FXC_PATH=$($fxc.FullName)"
          } else {
            Write-Output "fxc.exe not found under Windows Kits; relying on PATH/gpui default"
          }

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            $candidatePaths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $found = $null
            foreach ($cand in $candidatePaths) {
              if (Test-Path $cand) {
                $found = Split-Path $cand
                break
              }
            }
            if ($found) {
              Write-Output "Found Inno Setup at $found; adding to PATH"
              $found | Out-File -Append $env:GITHUB_PATH
            } else {
              Write-Output "Inno Setup not found; installing via Chocolatey..."
              choco install innosetup --no-progress
              "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append $env:GITHUB_PATH
            }
          }

      - name: cargo test (unit tests)
        shell: pwsh
        run: |
          cargo test --release --bin atlas-terminal -- --nocapture

      - name: cargo build (release — final exe)
        shell: pwsh
        run: |
          cargo build --release --bin atlas-terminal 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## cargo build failed (exit $code)" >> $env:GITHUB_STEP_SUMMARY
            # Mirror rustc errors as workflow annotations so they are readable
            # without authentication (logs + artifacts need a login).
            $n = 0
            $pending = ""
            foreach ($line in Get-Content build-output.log) {
              if ($line -match '^(?<sev>error|warning)(?<rest>.*)$') {
                $pending = "$($matches['sev'])$($matches['rest'])"
              } elseif ($pending -ne "" -and $line -match '^\s*-->\s*(?<loc>\S+)\s*$') {
                if ($n -lt 60) {
                  $n++
                  $msg = ("$pending @ $($matches['loc'])") -replace '%','%25'
                  Write-Output "::error::$msg"
                }
                $pending = ""
              } elseif ($line -match '^\s*$') {
                if ($pending -ne "" -and $n -lt 60) {
                  $n++
                  $msg = ($pending -replace '%','%25')
                  Write-Output "::error::$msg"
                }
                $pending = ""
              }
            }
            if ($pending -ne "" -and $n -lt 60) {
              Write-Output ("::error::" + ($pending -replace '%','%25'))
            }
            Get-Content build-output.log -Tail 150 | Out-String >> $env:GITHUB_STEP_SUMMARY
            exit $code
          }
          "## atlas-terminal compiled (release)" >> $env:GITHUB_STEP_SUMMARY

          # Locate built binary in workspace target
          $builtTerm = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          if (-not (Test-Path $builtTerm)) {
            throw "Built binary not found at $builtTerm"
          }

          # Mirror to both filenames for compatibility
          $destPaths = @(
            (Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"),
            (Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-native.exe")
          )
          foreach ($dst in $destPaths) {
            $dir = Split-Path $dst
            if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force $dir | Out-Null }
            if ($dst -ne $builtTerm) {
              Copy-Item $builtTerm $dst -Force
            }
          }
          Write-Output "Mirrored single release binary to all target destinations"

      - name: Smoke test (launch release exe, wait for window)
        shell: pwsh
        # Informational: the runner has no real GPU. Never blocks the artifact.
        # Tells us whether the exe got past GPUI platform init ("window opened")
        # or died (PANIC in the log). Results are mirrored as public annotations.
        continue-on-error: true
        run: |
          $candidate1 = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          $candidate2 = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-native.exe"
          $exe = if (Test-Path $candidate1) { $candidate1 } else { $candidate2 }
          $log = Join-Path $env:TEMP "atlas-native-debug.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $log) {
              $content = Get-Content $log -Raw
              if ($content -match "window opened") { $ok = $true; break }
              if ($content -match "PANIC") { break }
            }
            if ($proc.HasExited -and -not (Test-Path $log)) { break }
          }
          # Give the DWM corner-rounding helper a beat to report.
          for ($i = 0; $i -lt 15; $i++) {
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match "dwm")) { break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Write-Output "----- atlas-native-debug.log -----"
          if (Test-Path $log) { Get-Content $log } else { Write-Output "(no log written)" }
          if ($ok) {
            "## smoke test: window opened" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "::notice title=smoke test::release exe reached 'window opened'"
            $dwm = if (Test-Path $log) { Get-Content $log | Where-Object { $_ -match "dwm" } | Select-Object -First 1 }
            if ($dwm) { Write-Output ("::notice title=dwm corners::" + ($dwm -replace '%','%25')) }
            $font = if (Test-Path $log) { Get-Content $log | Where-Object { $_ -match "font" } | Select-Object -First 1 }
            if ($font) { Write-Output ("::notice title=nerd font::" + ($font -replace '%','%25')) }
          } else {
            "## smoke test: did NOT observe 'window opened'" >> $env:GITHUB_STEP_SUMMARY
            $n = 0
            if (Test-Path $log) {
              foreach ($line in Get-Content $log) {
                if ($n -ge 12) { break }
                if ($line.Trim()) { $n++; Write-Output ("::warning title=smoke test::" + ($line -replace '%','%25')) }
              }
            } else {
              Write-Output "::warning title=smoke test::no log written (exe may have died before main)"
            }
          }

      - name: Build Inno Setup Installer & Zip Distribution
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Determine base version from Cargo.toml
          $cargoFile = Join-Path $env:GITHUB_WORKSPACE "Cargo.toml"
          $version = "0.1.4"
          if (Test-Path $cargoFile) {
            $match = Select-String -Path $cargoFile -Pattern '^version\s*=\s*"([^"]+)"'
            if ($match) {
              $version = $match.Matches[0].Groups[1].Value
            }
          }

          if ($env:GITHUB_REF -match '^refs/tags/v?(\d+\.\d+\.\d+)') {
            $version = $matches[1]
          }
          Write-Output "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Output "Packaging Atlas Terminal v$version"

          # 2. Run Inno Setup compiler
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $issPath = Join-Path $env:GITHUB_WORKSPACE "installer\atlas-terminal.iss"
          iscc.exe "/DMyAppVersion=$version" "/O$distDir" $issPath
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          # 3. Generate SHA256 checksum for installer
          $setupExe = Join-Path $distDir "AtlasTerminal-Setup-$version.exe"
          if (Test-Path $setupExe) {
            $shaFile = "$setupExe.sha256"
            $hash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([System.IO.Path]::GetFileName($setupExe))" | Out-File -Encoding ascii $shaFile
            Write-Output "Installer created: $setupExe ($hash)"
          } else {
            throw "Expected setup exe not found at $setupExe"
          }

          # 4. Create plain zip distribution (atlas-terminal-windows-x64.zip)
          $zipStaging = Join-Path $env:TEMP "atlas-terminal-zip-staging"
          Remove-Item -Recurse -Force $zipStaging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $zipStaging | Out-Null

          $termExe = Join-Path $env:GITHUB_WORKSPACE "target\release\atlas-terminal.exe"
          Copy-Item $termExe (Join-Path $zipStaging "atlas-terminal.exe")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE") (Join-Path $zipStaging "LICENSE")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "README.md") (Join-Path $zipStaging "README.md")
          Copy-Item -Recurse (Join-Path $env:GITHUB_WORKSPACE "assets") (Join-Path $zipStaging "assets")

          $zipFile = Join-Path $distDir "atlas-terminal-windows-x64.zip"
          Remove-Item $zipFile -ErrorAction SilentlyContinue
          Compress-Archive -Path "$zipStaging\*" -DestinationPath $zipFile -Force
          Remove-Item -Recurse -Force $zipStaging -ErrorAction SilentlyContinue

          $zipSha = "$zipFile.sha256"
          $hashZip = (Get-FileHash -Path $zipFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hashZip *$([System.IO.Path]::GetFileName($zipFile))" | Out-File -Encoding ascii $zipSha
          Write-Output "Zip created: $zipFile ($hashZip)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-terminal-build-log
          path: build-output.log
          if-no-files-found: ignore

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-terminal-binaries
          path: |
            target/release/atlas-terminal.exe
            target/release/atlas-native.exe
          if-no-files-found: error

      - name: Upload distribution packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-terminal-dist
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release (on tag v*)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          Write-Output "Publishing release for tag: $tag"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Atlas Terminal $tag" --generate-notes
          }
          $files = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist\*" -File | ForEach-Object { $_.FullName }
          gh release upload $tag $files --clobber
